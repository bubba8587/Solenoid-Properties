# Builds the plugin from THIS repository's source and publishes a GitHub Release with the three
# files Obsidian installs, each with a build provenance attestation. Runs on a tag push (the tag
# is the bare version, e.g. 0.1.1) or by hand from the Actions tab with the version typed in; the
# by-hand run creates the tag. Run by hand with "publish" off, it only builds and keeps the files
# as a run artifact: a check that the source builds, with no release made.
#
# The source in src/ and obsidian-plugin/ is a snapshot exported from bubba8587/solenoid, where
# the plugin is developed (source.json names the commit). Nothing is edited here by hand.
name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release; must equal manifest.json's"
        required: true
      publish:
        description: "Publish the release (off: build only, files land as a run artifact)"
        type: boolean
        default: true

permissions:
  contents: write
  # For the build provenance attestations.
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version
        run: |
          manifest=$(jq -r .version manifest.json)
          if [ "$VERSION" != "$manifest" ]; then
            echo "::error::release $VERSION but manifest.json says $manifest"; exit 1
          fi
          jq -e --arg v "$VERSION" 'has($v)' versions.json > /dev/null \
            || { echo "::error::versions.json has no entry for $VERSION"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build the plugin
        run: npm run build

      - name: Collect the release files
        run: |
          if ! diff <(jq -S . manifest.json) <(jq -S . dist/manifest.json); then
            echo "::error::manifest.json differs from the one the build emitted (obsidian-plugin/manifest.json)"; exit 1
          fi
          mkdir release
          cp dist/main.js dist/styles.css release/
          cp manifest.json release/
          ls -l release

      - name: Keep the files as a run artifact
        uses: actions/upload-artifact@v4
        with:
          name: solenoid-properties-${{ env.VERSION }}
          path: release/
          if-no-files-found: error

      - name: Attest the build provenance
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            release/main.js
            release/manifest.json
            release/styles.css

      - name: Publish the release
        if: github.event_name == 'push' || github.event.inputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            release/main.js
            release/manifest.json
            release/styles.css
